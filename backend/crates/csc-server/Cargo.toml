[package]
name = "csc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "服务端（M9）：axum REST/WS + channel 决策源桥接——每局一个模拟线程，多局天然隔离"

[dependencies]
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
flate2 = "1"
crc32fast = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
csc-text = { path = "../csc-text" }
csc-career = { path = "../csc-career" }
csc-core = { path = "../csc-core" }
csc-decision = { path = "../csc-decision" }
csc-domain = { path = "../csc-domain" }
csc-events = { path = "../csc-events" }
csc-entities = { path = "../csc-entities" }
csc-simulation = { path = "../csc-simulation" }
csc-time = { path = "../csc-time" }
csc-util = { path = "../csc-util" }
csc-vrs = { path = "../csc-vrs" }
csc-systems = { path = "../csc-systems" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "csc-server"
path = "src/main.rs"
